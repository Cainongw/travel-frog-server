apiVersion: v1
kind: Namespace
metadata:
  name: travel-frog
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: travel-frog-data
  namespace: travel-frog
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-2replicas
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-frog-config
  namespace: travel-frog
data:
  FROG_ADMIN_AUTH: oidc
  FROG_PUBLIC_URL: https://travelfrog.caiw.pp.ua:8133
  FROG_OIDC_DISCOVERY_URL: https://auth.caiw.pp.ua:8133/application/o/travel-frog/.well-known/openid-configuration
  FROG_OIDC_ALLOWED_GROUPS: travel-frog-admins
  FROG_ALLOW_REMOTE_GAME: '1'
  FROG_GAME_AUTH_REQUIRED: '1'
  FROG_ASSETS: /data/assets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-frog
  namespace: travel-frog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: travel-frog
  template:
    metadata:
      labels:
        app: travel-frog
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: server
        image: harbor.k8s.lan/library/travel-frog-server:0.9.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: travel-frog-config
        - secretRef:
            name: travel-frog-oidc
        volumeMounts:
        - name: data
          mountPath: /data
        startupProbe:
          httpGet: {path: /health, port: http}
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 15
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: '2', memory: 768Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: travel-frog-data
---
apiVersion: v1
kind: Service
metadata:
  name: travel-frog
  namespace: travel-frog
spec:
  selector:
    app: travel-frog
  ports:
  - name: http
    port: 8080
    targetPort: http
  type: ClusterIP
