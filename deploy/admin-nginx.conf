map $http_upgrade $frog_connection { default upgrade; '' close; }
server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;
    location = /health { access_log off; default_type application/json; return 200 '{"ok":true,"component":"admin"}'; }
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }
    location = /admin { return 302 /admin/; }
    location / {
        proxy_pass http://travel-frog:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $frog_connection;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
